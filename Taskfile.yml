version: '3'

tasks:
  build:
    desc: Build the poddle binary
    cmds:
      - go build -o bin/poddle ./src/cli

  test:
    desc: Run unit tests (co-located in src/)
    cmds:
      - go test ./src/...

  arch:
    desc: Run architecture / boundary tests
    cmds:
      - go test ./tests/architecture/...

  _docker-mirror:
    internal: true
    desc: CI-only. Route docker.io pulls through AWS ECR Public so e2e dodges Docker Hub's anonymous rate limit.
    status:
      - test -z "$CI" # skip locally (only CI writes /etc/containers); GitHub Actions sets $CI
    cmds:
      # sudo because CI runners are non-root; writing /etc/containers needs root.
      - sudo mkdir -p /etc/containers/registries.conf.d
      - printf '%s\n' '[[registry]]' 'location = "docker.io"' '[[registry.mirror]]' 'location = "public.ecr.aws/docker"' | sudo tee /etc/containers/registries.conf.d/aws-mirror.conf > /dev/null

  e2e:
    desc: Pod lifecycle e2e (needs podman) — local + remote up/ls/down. Feature suites have their own e2e-* tasks.
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run 'TestE2E_Local_Lifecycle|TestE2E_Remote_Lifecycle' ./tests/e2e/...

  e2e-claude:
    desc: Real Claude Code secretless round-trip (needs docker; pulls node:22 + installs claude-code)
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Secretless ./src/internal/broker/...

  e2e-up:
    desc: Full poddle up --identity --exec secretless e2e (needs podman)
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Up_Secretless ./tests/e2e/...

  e2e-resize:
    desc: Resize e2e (needs podman) — live CPU update on a running pod
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Up_Resize ./tests/e2e/...

  e2e-move:
    desc: Move e2e (needs podman) — session state survives a move to a re-sized shell
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Move ./tests/e2e/...

  e2e-resume-move:
    desc: Resume-on-move e2e (needs podman) — a moved headless task auto-resumes the agent
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_ResumeMove ./tests/e2e/...

  e2e-autoscale:
    desc: Autoscale e2e (needs podman) — daemon warns interactive + auto-grows headless under memory pressure
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Autoscale ./tests/e2e/...

  e2e-remote:
    desc: Remote e2e (needs podman) — up/ls/down over ssh (loopback fixture provides PODDLE_HOST)
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Remote_Loopback ./tests/e2e/...

  e2e-templates:
    desc: Templates e2e (needs podman) — extends nesting, scripts, repo clone, harness install
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Templates ./tests/e2e/...

  e2e-connector:
    desc: Connector e2e (needs podman) — every built-in connector through the broker (one subtest each)
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Connectors ./tests/e2e/...

  e2e-secure:
    desc: Secret-safety e2e (needs podman) — blocked-mount refusal + broker egress redaction
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Secure ./tests/e2e/...

  e2e-poddled:
    desc: Poddled e2e (needs podman) — up --detach -> run -> down through the persistent broker
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Poddled ./tests/e2e/...

  e2e-l4:
    desc: L4 broker e2e (needs podman) — a pod hits real Redis + Postgres through the broker with only a handle
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_L4 ./tests/e2e/...

  e2e-task:
    desc: Task e2e (needs podman) — poddle task runs a coding agent headless through the broker
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Task ./tests/e2e/...

  e2e-audit:
    desc: Audit e2e (needs podman) — brokered access is recorded, secret-free, in `poddle daemon audit`
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Audit ./tests/e2e/...

  e2e-policy:
    desc: Policy e2e (needs podman) — a governance policy denies a disallowed upstream (403 + audited)
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_Policy ./tests/e2e/...

  e2e-forward:
    desc: Forward-proxy e2e (needs podman) — forced egress; policy governs the pod's arbitrary egress
    deps: [_docker-mirror]
    cmds:
      - go test -tags e2e -v -run TestE2E_ForwardProxy ./tests/e2e/...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Check gofmt formatting (fails on unformatted files)
    cmds:
      - cmd: 'test -z "$(gofmt -l ./src ./tests)" || (echo "gofmt: unformatted files:" && gofmt -l ./src ./tests && exit 1)'

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  run:
    desc: 'Run poddle from source, e.g. task run -- up --size weak'
    cmds:
      - go run ./src/cli -- {{.CLI_ARGS}}

  web-dev:
    desc: Run the marketing site dev server
    dir: src/web/site
    cmds:
      - npm run dev

  web-build:
    desc: Build the static marketing site (src/web/site)
    dir: src/web/site
    cmds:
      - npm ci
      - npm run build

  web-check:
    desc: Typecheck the marketing site (astro check)
    dir: src/web/site
    cmds:
      - npm ci
      - npm run check

  web-test:
    desc: Run the marketing site component tests (Vitest)
    dir: src/web/site
    cmds:
      - npm ci
      - npm run test

  dashboard-build:
    desc: Build the Preact dashboard SPA into the embedded bundle (src/cli/dashboard/dist, committed)
    dir: src/web/dashboard
    cmds:
      - npm ci
      - npm run build

  e2e-ui:
    desc: Dashboard UI e2e (Playwright) — drives the real `poddle dashboard` binary in a real browser
    deps: [build] # produces bin/poddle for the webServer
    dir: src/web/dashboard
    cmds:
      - npm ci
      - npx playwright install chromium # matches the installed @playwright/test, image-version-independent
      - npx playwright test

  e2e-site:
    desc: Marketing site e2e (Playwright) — builds the static site and drives it in a real browser
    dir: src/web/site
    cmds:
      - npm ci
      - npx playwright install chromium
      - npx playwright test

  web-docs:
    desc: Regenerate the docs CLI reference from cobra + lint the doc template examples
    cmds:
      - go run -tags docgen ./src/cli > src/web/site/src/data/cli.json
      - go test ./src/internal/config -run TestDocExampleTemplates

  integration:
    desc: Integration tests against a real container engine (skips without one)
    cmds:
      - go test -tags integration ./...

  ci:
    desc: What CI runs (fast, container-free)
    deps: [vet, fmt, test, arch, build]

  test-all:
    desc: Every tier (needs a container engine for integration/e2e)
    deps: [vet, test, arch, integration, e2e, build]

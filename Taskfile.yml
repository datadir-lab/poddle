version: '3'

tasks:
  build:
    desc: Build the poddle binary
    cmds:
      - go build -o bin/poddle ./src/cli

  test:
    desc: Run unit tests (co-located in src/)
    cmds:
      - go test ./src/...

  arch:
    desc: Run architecture / boundary tests
    cmds:
      - go test ./tests/architecture/...

  e2e:
    desc: Run end-to-end tests (drives the built binary; needs podman)
    cmds:
      - go test -tags e2e -v ./tests/e2e/...

  e2e-claude:
    desc: Real Claude Code secretless round-trip (needs docker; pulls node:22 + installs claude-code)
    cmds:
      - go test -tags e2e -v -run TestE2E_Secretless ./src/internal/broker/...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Check gofmt formatting (fails on unformatted files)
    cmds:
      - cmd: 'test -z "$(gofmt -l ./src ./tests)" || (echo "gofmt: unformatted files:" && gofmt -l ./src ./tests && exit 1)'

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  run:
    desc: 'Run poddle from source, e.g. task run -- up --size weak'
    cmds:
      - go run ./src/cli -- {{.CLI_ARGS}}

  integration:
    desc: Integration tests against a real container engine (skips without one)
    cmds:
      - go test -tags integration ./...

  ci:
    desc: What CI runs (fast, container-free)
    deps: [vet, fmt, test, arch, build]

  test-all:
    desc: Every tier (needs a container engine for integration/e2e)
    deps: [vet, test, arch, integration, e2e, build]

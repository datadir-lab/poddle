# goreleaser config - builds poddle binaries and cuts a GitHub Release on tag.
# Local check:  goreleaser check   |   dry run:  goreleaser release --snapshot --clean
version: 2

project_name: poddle

before:
  hooks:
    - go mod download

builds:
  - id: poddle
    main: ./src/cli
    binary: poddle
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: poddle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# SBOM per archive (syft) and keyless cosign signature over the checksums file.
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# Linux packages (.deb, .rpm, .apk) attached to each release.
nfpms:
  - id: poddle
    package_name: poddle
    homepage: https://github.com/datadir-lab/poddle
    description: Self-hostable, secret-safe dev sandboxes for coding agents.
    maintainer: datadir <hello@datadir.co>
    license: AGPL-3.0
    vendor: datadir
    formats: [deb, rpm, apk]
    recommends:
      - podman

# Homebrew (macOS): `brew tap datadir-lab/tap && brew install poddle`.
# Casks are the current goreleaser way to ship a pre-built binary; `brews`
# (formula) is deprecated. macOS-focused - Linux users use curl|sh, the
# .deb/.rpm/.apk, or go install. Pushes to datadir-lab/homebrew-tap when
# TAP_GITHUB_TOKEN is set; skips otherwise, so releases never break.
homebrew_casks:
  - repository:
      owner: datadir-lab
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: https://github.com/datadir-lab/poddle
    description: Self-hostable, secret-safe dev sandboxes for coding agents.
    license: AGPL-3.0
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    binaries:
      - poddle
    caveats: "poddle runs pods with podman - install it separately: brew install podman"

# Scoop bucket (Windows): `scoop bucket add poddle <url> && scoop install poddle`.
scoops:
  - repository:
      owner: datadir-lab
      name: scoop-bucket
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    homepage: https://github.com/datadir-lab/poddle
    description: Self-hostable, secret-safe dev sandboxes for coding agents.
    license: AGPL-3.0
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^style'

release:
  github:
    owner: datadir-lab
    name: poddle
  prerelease: auto

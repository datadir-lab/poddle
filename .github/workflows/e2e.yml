name: E2E

# Heavy end-to-end suites: real podman pods driven by the real poddle binary
# against a real broker. They need a container engine, so they run separately
# from the fast `ci` gate, on demand ("Run workflow").
#
# Ported from the woodpecker/ pipelines, archived on branch archive/woodpecker-ci.
# GitHub-hosted runners ship rootless podman and run 17 of the 19 suites green.
# e2e-move and e2e-task need ROOTFUL podman (they mix a custom XDG_RUNTIME_DIR
# with direct podman calls, which only works as root, the retired Woodpecker
# setup), so they are not in the default set; run them with the `suites` input
# on a rootful or self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Space-separated task names to run (empty = the full set)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    env:
      REQUESTED: ${{ inputs.suites }}
    steps:
      - id: pick
        run: |
          # Default set: the 17 suites that pass on GitHub's rootless podman.
          # e2e-move and e2e-task are omitted (need rootful podman); pass them
          # explicitly via the `suites` input on a rootful/self-hosted runner.
          all='["e2e-up","e2e-l4","e2e-connector","e2e-templates","e2e-audit","e2e-policy","e2e-forward","e2e-intercept","e2e-edit","e2e-secure","e2e-poddled","e2e-resize","e2e-resume-move","e2e-autoscale","e2e-ui","e2e-site","e2e-claude","e2e-remote","e2e","integration"]'
          if [ -n "$REQUESTED" ]; then
            echo "suites=$(printf '%s' "$REQUESTED" | jq -R -c 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          else
            echo "suites=$all" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Engine versions
        run: |
          podman version || true
          docker version --format 'docker {{.Server.Version}}' || true
      - name: Force slirp4netns for rootless podman (bypass pasta's systemd/dbus need in CI)
        # The containerized broker needs an internet uplink; rootless podman's
        # default `pasta` backend tries to move its process into a systemd user
        # slice, which needs a dbus session that isn't reliably present when
        # podman is spawned under `go test`. slirp4netns needs neither. System-
        # wide so it applies despite tests overriding XDG_CONFIG_HOME.
        run: |
          if ! command -v slirp4netns >/dev/null; then
            sudo apt-get update && sudo apt-get install -y slirp4netns
          fi
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '%s\n' '[network]' 'default_rootless_network_cmd = "slirp4netns"' \
            | sudo tee /etc/containers/containers.conf.d/10-slirp4netns.conf > /dev/null
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Run ${{ matrix.suite }}
        run: task ${{ matrix.suite }}

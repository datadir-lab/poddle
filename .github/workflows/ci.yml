name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, fmt, test, arch, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: task ci
        run: task ci
      - name: Race + coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./src/...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # On PRs only report issues introduced by the change; on main, lint everything.
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  web:
    name: Website (tests + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/site/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run check
      - run: npm run build
      - name: Assert the site builds and keeps its safety copy
        working-directory: src/web/site
        run: |
          test -f dist/index.html
          grep -q "leak out of" dist/index.html

  dashboard-e2e:
    name: Dashboard UI e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      # Drives the real `poddle dashboard` binary in headless chromium — no podman,
      # so it belongs in PR CI (unlike the podman e2e suites). task e2e-ui builds
      # bin/poddle (deps: build), installs chromium, and runs the Playwright specs.
      - name: task e2e-ui
        run: task e2e-ui
      # The audit screenshot is a deterministic render (seeded data, frozen clock,
      # pinned chromium), so verify freshness by re-rendering and diffing rather than
      # by change-coupling — an invisible dashboard change re-renders identically and
      # passes, while a real visual change whose screenshot wasn't refreshed fails.
      - name: Re-render the dashboard screenshot
        run: node tests/screenshot.mjs
        working-directory: src/web/dashboard
      - name: Fail if the committed dashboard screenshot is stale
        run: |
          if ! git diff --quiet -- '*dashboard-audit.png'; then
            echo "::error::dashboard-audit.png is stale for the current dashboard — run 'task assets' and commit it."
            git --no-pager diff --stat -- '*dashboard-audit.png'
            exit 1
          fi

  commitlint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Lint PR commit messages
        run: >
          npx --no-install commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

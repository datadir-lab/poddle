name: E2E coverage

# Reports the e2e suites' coverage to Codecov under the `e2e` flag. The e2e
# tests drive the *built* poddle binary against real podman, so their coverage
# needs Go binary coverage (go build -cover + GOCOVERDIR), not `go test -cover`;
# the buildBinary helper instruments the binary whenever GOCOVERDIR is set.
#
# Each suite runs as its own matrix job (in parallel) and uploads its own
# coverage under the `e2e` flag. Codecov unions same-flag uploads, so the
# combined e2e coverage is the union of every suite — at the wall-clock cost of
# the single slowest suite instead of the sum of all of them.
#
# Heavy (real pods), so it stays off the per-PR and per-push path: nightly and
# on demand only. The `e2e` flag carries forward in codecov.yml, so ordinary
# commits keep the last reported number between runs.

on:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-coverage:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Suites that pass on GitHub's rootless podman AND drive the instrumented
        # binary (so GOCOVERDIR captures their coverage). e2e-move/e2e-task
        # isolate poddled's socket via PODDLE_SOCKET (not XDG_RUNTIME_DIR), so
        # they run rootless too. Excluded: e2e-ui/e2e-claude (UI / external
        # harness); e2e-remote (stubbed harness, drives nothing yet); integration
        # (in-process `go test`, not the spawned binary) — none produce covdata.
        suite:
          - e2e-up
          - e2e-l4
          - e2e-connector
          - e2e-templates
          - e2e-audit
          - e2e-policy
          - e2e-forward
          - e2e-intercept
          - e2e-lockdown
          - e2e-secure
          - e2e-poddled
          - e2e-resize
          - e2e-move
          - e2e-task
          - e2e-resume-move
          - e2e-autoscale
          - e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Run ${{ matrix.suite }} with coverage
        env:
          GOCOVERDIR: ${{ github.workspace }}/covdata
        run: |
          mkdir -p "$GOCOVERDIR"
          task ${{ matrix.suite }} || echo "::warning::suite ${{ matrix.suite }} failed (continuing for partial coverage)"
          if ls "$GOCOVERDIR"/covmeta.* >/dev/null 2>&1; then
            go tool covdata textfmt -i="$GOCOVERDIR" -o=coverage-e2e.txt
            echo "HAS_COV=1" >> "$GITHUB_ENV"
            echo "coverage from ${{ matrix.suite }}:"
            go tool cover -func=coverage-e2e.txt | tail -1
            # The containerized broker now writes its own covdata (instrumented
            # image + bind-mounted GOCOVERDIR); this should be >0, where it was 0
            # while the broker ran a non-instrumented binary.
            echo "broker-side funcs captured: $(grep -cE 'src/internal/(broker|poddled|l4)/' coverage-e2e.txt || true)"
          else
            echo "::warning::${{ matrix.suite }} produced no coverage data"
          fi
      - name: Upload ${{ matrix.suite }} coverage to Codecov
        if: env.HAS_COV == '1'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-e2e.txt
          flags: e2e
          fail_ci_if_error: false

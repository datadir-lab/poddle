name: E2E coverage

# Reports the e2e suites' coverage to Codecov under the `e2e` flag. The e2e
# tests drive the *built* poddle binary against real podman, so their coverage
# needs Go binary coverage (go build -cover + GOCOVERDIR), not `go test -cover`;
# the buildBinary helper instruments the binary whenever GOCOVERDIR is set.
#
# Each suite runs as its own matrix job (in parallel) and uploads its own
# coverage under the `e2e` flag. Codecov unions same-flag uploads, so the
# combined e2e coverage is the union of every suite — at the wall-clock cost of
# the single slowest suite instead of the sum of all of them.
#
# Heavy (real pods), so it stays off the per-PR and per-push path: nightly and
# on demand only. The `e2e` flag carries forward in codecov.yml, so ordinary
# commits keep the last reported number between runs.

on:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-coverage:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Suites that pass on GitHub's rootless podman and drive the Go binary.
        # e2e-move/e2e-task isolate poddled's socket via PODDLE_SOCKET (not
        # XDG_RUNTIME_DIR), so they run rootless too. e2e-ui/e2e-claude (UI /
        # external harness, no Go-coverage value) stay out.
        suite:
          - e2e-up
          - e2e-l4
          - e2e-connector
          - e2e-templates
          - e2e-audit
          - e2e-policy
          - e2e-forward
          - e2e-secure
          - e2e-poddled
          - e2e-resize
          - e2e-move
          - e2e-task
          - e2e-resume-move
          - e2e-autoscale
          - e2e-remote
          - e2e
          - integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Run ${{ matrix.suite }} with coverage
        env:
          GOCOVERDIR: ${{ github.workspace }}/covdata
        run: |
          mkdir -p "$GOCOVERDIR"
          task ${{ matrix.suite }} || echo "::warning::suite ${{ matrix.suite }} failed (continuing for partial coverage)"
          if ls "$GOCOVERDIR"/covmeta.* >/dev/null 2>&1; then
            go tool covdata textfmt -i="$GOCOVERDIR" -o=coverage-e2e.txt
            echo "HAS_COV=1" >> "$GITHUB_ENV"
            echo "coverage from ${{ matrix.suite }}:"
            go tool cover -func=coverage-e2e.txt | tail -1
          else
            echo "::warning::${{ matrix.suite }} produced no coverage data"
          fi
      - name: Upload ${{ matrix.suite }} coverage to Codecov
        if: env.HAS_COV == '1'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-e2e.txt
          flags: e2e
          fail_ci_if_error: false

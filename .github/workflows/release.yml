name: Release

on:
  push:
    tags: ['v*']
  # Manual: run the install smoke matrix against an EXISTING tag. No publish,
  # no rollback - just proves the install methods work for that release.
  workflow_dispatch:
    inputs:
      smoke_tag:
        description: 'Existing release tag to smoke-test (e.g. v0.1.1)'
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # cosign keyless signing (OIDC)
    outputs:
      # base64(checksums.txt): the SLSA subjects the provenance job attests.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask + Scoop manifest to the tap/bucket repos.
          # Absent -> goreleaser skips those uploads (release still succeeds).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Hash release artifacts for provenance
        id: hashes
        run: |
          set -euo pipefail
          # SLSA subjects = the sha256 lines goreleaser already wrote to
          # checksums.txt. base64 the whole file; the generic generator expects
          # exactly this format ("<sha256>  <filename>" per line).
          echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

      # Keep get.poddle.dev (curl | sh) serving the current installer. Skips
      # cleanly if the Bunny storage key is absent, so releases never break.
      - name: Publish install.sh to get.poddle.dev
        env:
          BUNNY_KEY: ${{ secrets.BUNNY_GET_STORAGE_KEY }}
        run: |
          if [ -z "$BUNNY_KEY" ]; then
            echo "BUNNY_GET_STORAGE_KEY not set; skipping get.poddle.dev upload."
            exit 0
          fi
          # Upload to both paths: index.html so `curl get.poddle.dev` (the root
          # document) serves the installer directly, and install.sh for the
          # explicit /install.sh path.
          for path in index.html install.sh; do
            curl -fsS -T install.sh \
              -H "AccessKey: $BUNNY_KEY" \
              "https://storage.bunnycdn.com/datadir-poddle-get/$path"
          done
          echo "Uploaded installer to get.poddle.dev (index.html + install.sh)."

  # --- Post-release install verification -----------------------------------
  # Each job installs poddle from the just-published release the way a user
  # would, asserts `poddle version` reports the released version, then
  # uninstalls and confirms it is gone. A failure trips the rollback job.

  smoke-linux:
    name: install (linux / ${{ matrix.method }})
    needs: goreleaser
    if: always() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        method: [installsh, deb, rpm, apk]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }} # the released tag, so install.sh matches the release
      - name: Wait for the release to be current
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || true)
            latest=$(printf '%s' "$body" | grep -m1 '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
            [ "$latest" = "$TAG" ] && { echo "release $TAG is live"; break; }
            echo "waiting for release $TAG ($i)..."; sleep 10
          done

      - name: Install, verify, uninstall
        run: |
          set -eux
          NUM="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          base="https://github.com/$REPO/releases/download/$TAG"

          case "${{ matrix.method }}" in
            installsh)
              # Run the repo's own installer (checked out at the tag) instead of
              # piping the get.poddle.dev CDN script into a shell: it is the same
              # script the CDN serves, but as a local file it is deterministic and
              # not a download-then-run (which Scorecard flags as unpinned). The
              # CDN upload itself is already verified at publish time by goreleaser.
              PODDLE_VERSION="$TAG" sh install.sh
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
              poddle version | grep -q "poddle $NUM"
              rm -f "$(command -v poddle)"
              hash -r 2>/dev/null || true
              ! command -v poddle
              ;;
            deb)
              # Verify removal by file, not `command -v` (the shell caches the
              # path from the earlier `poddle version`, giving a false positive).
              docker run --rm "debian:stable-slim" sh -eux -c "
                apt-get update -qq && apt-get install -y -qq curl >/dev/null
                curl -fsSL -o /tmp/p.deb $base/poddle_${NUM}_linux_amd64.deb
                dpkg -i /tmp/p.deb
                poddle version | grep -q 'poddle $NUM'
                dpkg -r poddle
                [ ! -e /usr/bin/poddle ]"
              ;;
            rpm)
              docker run --rm "fedora:latest" sh -eux -c "
                command -v curl >/dev/null || dnf install -y -q curl >/dev/null
                curl -fsSL -o /tmp/p.rpm $base/poddle_${NUM}_linux_amd64.rpm
                rpm -i /tmp/p.rpm
                poddle version | grep -q 'poddle $NUM'
                rpm -e poddle
                [ ! -e /usr/bin/poddle ]"
              ;;
            apk)
              docker run --rm "alpine:latest" sh -eux -c "
                apk add --no-cache curl >/dev/null
                curl -fsSL -o /tmp/p.apk $base/poddle_${NUM}_linux_amd64.apk
                apk add --allow-untrusted /tmp/p.apk
                poddle version | grep -q 'poddle $NUM'
                apk del poddle
                [ ! -e /usr/bin/poddle ]"
              ;;
          esac

  smoke-macos:
    name: install (macos / ${{ matrix.method }})
    needs: goreleaser
    if: always() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        method: [installsh, brew]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }} # the released tag, so install.sh matches the release
      - name: Install, verify, uninstall
        run: |
          set -eux
          NUM="${TAG#v}"
          case "${{ matrix.method }}" in
            installsh)
              # Run the repo's own installer (checked out at the tag) instead of
              # piping the get.poddle.dev CDN script into a shell: same script,
              # but a local file - deterministic and not a Scorecard-flagged
              # download-then-run. The CDN upload is verified at publish time.
              PODDLE_VERSION="$TAG" sh install.sh
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
              poddle version | grep -q "poddle $NUM"
              rm -f "$(command -v poddle)"
              ! command -v poddle
              ;;
            brew)
              # Formula (not cask): formula binaries are not quarantined, so the
              # unsigned binary runs with no xattr workaround. Homebrew 6.0+ needs
              # a non-official tap trusted before installing a formula; `brew
              # trust` is the documented one-time step (older Homebrew lacks the
              # command and does not require trust, so fall back to the env var).
              brew tap datadir-lab/tap
              brew trust datadir-lab/tap || export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
              brew install poddle
              poddle version | grep -q "poddle $NUM"
              BIN="$(command -v poddle)"
              brew uninstall poddle
              [ ! -e "$BIN" ]
              ;;
          esac

  smoke-windows:
    name: install (windows / scoop)
    needs: goreleaser
    if: always() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tag || github.ref_name }}
    steps:
      - name: Install, verify, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $num = $env:TAG.TrimStart('v')
          irm get.scoop.sh -outfile "$env:TEMP\scoop.ps1"
          & "$env:TEMP\scoop.ps1" -RunAsAdmin
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add poddle https://github.com/datadir-lab/scoop-bucket
          scoop install poddle
          $out = poddle version
          if ($out -notmatch "poddle $num") { throw "version mismatch: $out" }
          scoop uninstall poddle
          if (Get-Command poddle -ErrorAction SilentlyContinue) { throw "uninstall failed" }

  # --- Rollback -------------------------------------------------------------
  # Only on a real release (push) where goreleaser succeeded but an install
  # smoke test failed. Undo the publish so users never see a broken release.
  rollback:
    name: rollback the release
    needs: [goreleaser, smoke-linux, smoke-macos, smoke-windows]
    if: >-
      always() && github.event_name == 'push' &&
      needs.goreleaser.result == 'success' &&
      (needs.smoke-linux.result == 'failure' ||
       needs.smoke-macos.result == 'failure' ||
       needs.smoke-windows.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete the release + tag
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Delete the GitHub release and tag
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "Deleted release and tag $TAG."

      - name: Revert the Homebrew tap and Scoop bucket
        if: env.TAP_TOKEN != ''
        run: |
          git config --global user.name "poddle-ci"
          git config --global user.email "ci@datadir.co"
          for repo in homebrew-tap scoop-bucket; do
            url="https://x-access-token:${TAP_TOKEN}@github.com/datadir-lab/${repo}.git"
            rm -rf "$repo" && git clone --depth 2 "$url" "$repo"
            ( cd "$repo"
              # goreleaser makes one commit per release; revert it so the tap
              # no longer advertises the broken version.
              if git revert --no-edit HEAD; then
                git push origin HEAD
                echo "Reverted latest commit in $repo."
              else
                echo "Nothing to revert in $repo (or manual state); skipping." >&2
              fi )
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release $TAG rolled back"
            echo ""
            echo "An install smoke test failed, so the release was withdrawn:"
            echo "- Deleted the GitHub release and tag \`$TAG\`"
            echo "- Reverted the Homebrew cask and Scoop manifest"
            echo "- get.poddle.dev self-heals (its installer fetches the latest release)"
            echo ""
            echo "Fix the issue and cut a new tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- SLSA build provenance ------------------------------------------------
  # Attaches a signed SLSA provenance attestation (poddle.intoto.jsonl) to the
  # release, but only once every install smoke test passes - so provenance is
  # never left on a release that the rollback job is about to withdraw. This
  # takes the OpenSSF Scorecard Signed-Releases check to 10/10 (a *.intoto.jsonl
  # release asset), on top of the existing cosign signature over the checksums.
  #
  # The SLSA generator MUST be referenced by version tag, not a commit SHA: it
  # derives the trusted builder identity recorded in the provenance from the
  # tag, and a digest reference is unsupported. This is the one intentional
  # exception to our pin-by-SHA policy for third-party actions.
  provenance:
    name: SLSA provenance
    needs: [goreleaser, smoke-linux, smoke-macos, smoke-windows]
    if: >-
      always() && github.event_name == 'push' &&
      needs.goreleaser.result == 'success' &&
      needs.smoke-linux.result == 'success' &&
      needs.smoke-macos.result == 'success' &&
      needs.smoke-windows.result == 'success'
    permissions:
      actions: read # read the workflow run to build the provenance
      id-token: write # OIDC: keyless signing of the provenance
      contents: write # upload poddle.intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: poddle.intoto.jsonl
      upload-assets: true

-detach</tspan></text><text class="a1" x="30" y="105.0"><tspan fill="#d3cfc3">  7f3a9c2</tspan></text><text class="a2" x="30" y="130.0"><tspan fill="#63c08c">$ </tspan><tspan fill="#f4f0e7">poddle attach api</tspan></text><text class="a3" x="30" y="155.0"><tspan fill="#847f71">root@7f3a9c2e1b04:/# </tspan><tspan fill="#f4f0e7">env | grep ANTHROPIC</tspan></text><text class="a4" x="30" y="180.0"><tspan fill="#d3cfc3">ANTHROPIC_BASE_URL=http://host.containers.internal:41207</tspan><tspan fill="#847f71">     # the broker, not Anthropic</tspan></text><text class="a5" x="30" y="205.0"><tspan fill="#d3cfc3">ANTHROPIC_AUTH_TOKEN=</tspan><tspan fill="#e3b371">poddle_kR7v3nQ8tW…</tspan><tspan fill="#847f71">                     # a handle, not your key</tspan></text><text class="a6" x="30" y="230.0"><tspan fill="#847f71">root@7f3a9c2e1b04:/# </tspan><tspan fill="#f4f0e7">claude</tspan></text><g class="a7"><rect x="14" y="68.0" width="856" height="70" rx="9" fill="none" stroke="rgba(244,240,231,.15)"/></g><text class="a8" x="30" y="90.0"><tspan fill="#e0955e">✻ </tspan><tspan fill="#f4f0e7">Welcome to Claude Code</tspan></text><text class="a9" x="30" y="115.0"><tspan fill="#847f71">  /help for help   ·   cwd: /api   ·   Sonnet 4.5</tspan></text><g class="a10"><rect x="14" y="460.0" width="856" height="46" rx="9" fill="none" stroke="rgba(244,240,231,.15)"/></g><text class="a11" x="30" y="538.0"><tspan fill="#5f5b50">  ? for shortcuts</tspan></text><text class="a12" x="30" y="490.0"><tspan fill="#847f71">&gt; </tspan></text><text class="a13" x="48" y="490.0"><tspan fill="#f4f0e7">add a test for the crash at https://pastebin.com/raw/x7Q3 and push</tspan></text><g class="c14"><g style="animation:blk 1.06s steps(1,end) infinite"><rect x="48.0" y="481.0" width="9" height="17" rx="1.5" fill="#f4f0e7" opacity=".9"/></g></g><text class="a15" x="30" y="155.0"><tspan fill="#847f71">&gt; </tspan><tspan fill="#f4f0e7">add a test for the crash at https://pastebin.com/raw/x7Q3 and push</tspan></text><text class="a16" x="30" y="205.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#f4f0e7">Fetch</tspan><tspan fill="#d3cfc3">(https://pastebin.com/raw/x7Q3)</tspan></text><text class="a17" x="30" y="230.0"><tspan fill="#847f71">  ⎿  </tspan><tspan fill="#e0736b">⊘ blocked by poddle</tspan><tspan fill="#847f71"> — pastebin.com is not in the pod’s egress policy</tspan></text><text class="a18" x="30" y="255.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#d3cfc3">Working from the stack trace instead.</tspan></text><text class="a19" x="30" y="280.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#f4f0e7">Update</tspan><tspan fill="#d3cfc3">(parse_test.go)</tspan></text><text class="a20" x="30" y="305.0"><tspan fill="#847f71">  ⎿  added a case for the empty-input crash</tspan></text><text class="a21" x="30" y="330.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#f4f0e7">Bash</tspan><tspan fill="#d3cfc3">(go test ./...)</tspan></text><text class="a22" x="30" y="355.0"><tspan fill="#847f71">  ⎿  ok · acme/api · 0.42s </tspan><tspan fill="#5f5b50">(ctrl+o to expand)</tspan></text><text class="a23" x="30" y="380.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#f4f0e7">Bash</tspan><tspan fill="#d3cfc3">(git push)</tspan></text><text class="a24" x="30" y="405.0"><tspan fill="#847f71">  ⎿  main → main · github.com/acme/api</tspan></text><text class="a25" x="30" y="430.0"><tspan fill="#63b98a">⏺ </tspan><tspan fill="#d3cfc3">Added a test and pushed — pastebin stayed off-policy.</tspan></text><text class="a26" x="30" y="80.0"><tspan fill="#847f71">root@7f3a9c2e1b04:/# </tspan><tspan fill="#f4f0e7">exit</tspan></text><text class="a27" x="30" y="105.0"><tspan fill="#63c08c">$ </tspan><tspan fill="#f4f0e7">poddled audit</tspan></text><text class="a28" x="30" y="130.0"><tspan fill="#847f71">TIME      POD  KIND    DECISION UPSTREAM           DETAIL</tspan></text><text class="a29" x="30" y="155.0"><tspan fill="#d3cfc3">10:02:14  api  egress  </tspan><tspan fill="#63c08c">allow    </tspan><tspan fill="#d3cfc3">api.anthropic.com  claude-code</tspan></text><text class="a30" x="30" y="180.0"><tspan fill="#d3cfc3">10:02:15  api  egress  </tspan><tspan fill="#e3b371">redact   </tspan><tspan fill="#d3cfc3">api.anthropic.com  scrubbed 1 secret</tspan></text><text class="a31" x="30" y="205.0"><tspan fill="#d3cfc3">10:02:16  api  egress  </tspan><tspan fill="#e0736b">deny     </tspan><tspan fill="#d3cfc3">pastebin.com       not in policy</tspan></text><text class="a32" x="30" y="230.0"><tspan fill="#d3cfc3">10:02:17  api  egress  </tspan><tspan fill="#63c08c">allow    </tspan><tspan fill="#d3cfc3">github.com         git push</tspan></text><text class="a33" x="30" y="255.0"><tspan fill="#d3cfc3">  audit chain: </tspan><tspan fill="#63c08c">intact ✓</tspan></text></g><rect x="0.5" y="0.5" width="883" height="559" rx="14" fill="none" stroke="#faf8f2" stroke-opacity=".07"/></svg>
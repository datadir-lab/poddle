version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: / # root dev tooling (lefthook, commitlint)
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/web/site
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/web/dashboard
    schedule:
      interval: weekly

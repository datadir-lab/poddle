# Dashboard UI e2e — Playwright drives the real `poddle dashboard` in a browser.
#
# Uses the official Playwright image for its chromium system deps; `task e2e-ui`
# then `npx playwright install chromium` fetches the browser matching the pinned
# @playwright/test (image-version-independent). Installs Go to build the poddle
# binary, then runs the Playwright suite: the dashboard loads, the audit feed
# renders + filters +
# shows the chain-verify badge, and the policy editor creates/lists/deletes a
# policy through the real /v1/policies. No podman needed. Manual.

when:
  - event: [manual]

steps:
  e2e-ui:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    commands:
      - curl -sSL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz | tar -C /usr/local -xz
      - export PATH=$PATH:/usr/local/go/bin
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-ui

# Move e2e — stateless pods + `poddle move`.
#
# On this step's nested podman: `poddle up --detach` a pod, write a file to
# /workspace (a named volume), `poddle move --size strong` onto a fresh shell,
# and confirm the file survived into a NEW container that's been re-sized; then
# `poddle down` purges the session volumes. Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-move:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-move

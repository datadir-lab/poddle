# Templates e2e — extends nesting, referenced scripts, repo clone, and the
# claude-code harness actually installed, verified inside a real pod on this
# step's nested podman. Heavy (pulls node:22 + alpine, npm-installs claude-code,
# clones a repo); manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-templates:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-templates

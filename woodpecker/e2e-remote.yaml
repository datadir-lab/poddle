# Remote e2e — poddle drives podman over SSH (loopback fixture).
#
# The remote code path is the SSH transport (podman-remote over ssh), not a
# physically separate host. This fixture stands up sshd + a podman API socket on
# THIS runner and points poddle at ssh://root@127.0.0.1/…, so `up`/`ls`/`down`
# run over the real remote transport — reliably, unlike a nested host sim.
# Manual.
#
# Requires the repo to be security-trusted (privileged, for podman + sshd).

when:
  - event: [manual]

steps:
  e2e-remote:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git openssh openssh-server openssh-clients iproute
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      # sshd: host keys + root pubkey login
      - ssh-keygen -A
      - mkdir -p /root/.ssh && chmod 700 /root/.ssh
      - ssh-keygen -t ed25519 -N '' -f /root/.ssh/id_ed25519
      - cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys
      - "sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin yes/; s/^#\\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config"
      - /usr/sbin/sshd
      # podman API socket for podman-remote (poddle's ssh target)
      - podman system service --time=0 unix:///run/podman/podman.sock &
      - sleep 3
      # ssh-agent (podman's go ssh client uses it) + trust the loopback host key
      - eval "$(ssh-agent -s)"
      - ssh-add /root/.ssh/id_ed25519
      - ssh-keyscan -H 127.0.0.1 >> /root/.ssh/known_hosts 2>/dev/null
      - export PODDLE_HOST="ssh://root@127.0.0.1:22/run/podman/podman.sock"
      - task e2e-remote

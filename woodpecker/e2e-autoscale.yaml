# Autoscale e2e — poddled's reactive memory-grow autoscaler.
#
# On this step's nested podman: an interactive `up --autoscale` pod under
# (synthetic) memory pressure is WARNED in `poddle daemon status` and never
# moved; a headless `task --autoscale` pod under pressure is AUTO-GROWN by the
# daemon onto a fresh strong shell. Pressure is fed through the
# PODDLE_AUTOSCALE_STATS seam, since rootless nested podman has no cgroup for
# real `podman stats`. Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-autoscale:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git procps-ng
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-autoscale

# Real Claude Code secretless round-trip, in CI.
#
# Uses THIS step's nested podman (no host-socket needed): the broker listens in
# this step container, and the claude container reaches it via
# host.containers.internal — the same path real `poddle up` uses, so this also
# exercises podman host.containers.internal reachability. Heavy (pulls node:22,
# installs claude-code), so it is manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-claude:
    image: quay.io/podman/stable
    privileged: true
    environment:
      PODDLE_E2E_CONTAINER_CLI: podman
      PODDLE_E2E_BROKER_HOST: host.containers.internal
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-claude

# Web pipeline: typecheck + build the marketing site (src/web/site).
# Runs only when web files change, and is independent of the Go `ci` gate.
#
# NOTE: like the other files here, this relies on the project's Woodpecker
# "Pipeline Path" being set to `woodpecker/`.

when:
  # push/pull_request only. A `path:` filter here breaks ALL manual pipelines
  # (Woodpecker compiles every workflow and path filtering needs a diff, which
  # manual triggers lack), so we run on every push/PR instead — the build is
  # cheap and the manual e2e pipelines must compile.
  - event: [push, pull_request]

steps:
  web:
    image: node:22
    commands:
      - cd src/web/site
      - npm ci
      - npm run check
      - npm run test
      - npm run build
      - test -f dist/index.html
      - grep -q "leak out of" dist/index.html

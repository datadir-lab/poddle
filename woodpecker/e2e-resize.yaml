# Resize e2e — live CPU update on a running pod.
#
# On this step's nested podman: `poddle up --detach` a pod, `poddle resize
# --cpus 8`, and confirm via podman inspect that the CPU ceiling changed with no
# restart. (Memory-cap live-update is not permitted under rootless podman, so
# the e2e resizes CPU only; a rootful host can resize memory too.) Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-resize:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-resize

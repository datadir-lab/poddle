# L4 broker e2e — secretless Redis + Postgres through the TCP broker.
#
# On this step's nested podman: a real redis:7 and a real postgres:16 upstream
# (both password-protected, on the host network) are started; `poddle up
# --detach` gives a pod datastore connections wired to poddled's L4 listeners
# with a handle as the password; `poddle run redis-cli PING` / `psql SELECT`
# prove the broker swapped the handle for the real password (Redis AUTH,
# Postgres SCRAM-SHA-256) and that the pod's password is a handle, never the
# real one. Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-l4:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git procps-ng
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-l4

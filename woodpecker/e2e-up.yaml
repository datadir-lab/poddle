# Full `poddle up --identity --exec` secretless e2e — the automated 1.14b.
#
# Drives the REAL poddle binary on this step's nested podman: pod create +
# Setup (npm-install claude-code in the pod) + broker + Claude Code reaching the
# broker via host.containers.internal to a mock Anthropic upstream (sentinel
# token, no real account). Heavy (pulls node:22, installs claude-code); manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-up:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-up

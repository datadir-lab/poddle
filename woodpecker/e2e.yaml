# TEMP diagnostic: learn the Woodpecker runner's container environment so we can
# wire the socket-mount (Docker-out-of-Docker) pattern correctly for the remote
# e2e. Restored to the real e2e config after.
when:
  - event: [manual]

steps:
  diag:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - 'echo "=== id ==="; id'
      - 'echo "=== sockets present ==="; ls -la /var/run/docker.sock /run/docker.sock /run/podman/podman.sock 2>&1 || true'
      - 'echo "=== any .sock ==="; find /run /var/run -maxdepth 3 -name "*.sock" 2>/dev/null | head -20 || true'
      - 'echo "=== podman backend ==="; podman info --format "{{.Host.NetworkBackend}} / rootless={{.Host.Security.Rootless}}" 2>&1 | head -3 || true'
      - 'echo "=== ip addr ==="; ip -brief addr 2>&1 || true'
      - 'echo "=== routes ==="; ip route 2>&1 | head -5 || true'
      - 'echo "=== /etc/hosts ==="; cat /etc/hosts'
      - 'echo "=== woodpecker env ==="; env | grep -iE "DOCKER|WOODPECKER_BACKEND|CI_SYSTEM|CI_WORKSPACE" | sort'

# Integration + e2e.
#
# Two engines in play, deliberately:
#  - the step's own privileged nested podman  -> integration + local e2e (poddle up/ls/down),
#  - the host Docker engine via a mounted socket -> testcontainers spawns the remote-host
#    container as a SIBLING (Docker-out-of-Docker), reachable from the step on the docker
#    bridge. This is the recommended CI pattern (avoids nested-podman networking).
#
# Requires the repo to be security-trusted (privileged) AND volumes-trusted (socket mount).

when:
  - event: [manual]

steps:
  e2e:
    image: quay.io/podman/stable
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
      PODDLE_E2E_REMOTE: "1"
    commands:
      - dnf install -y golang git openssh-clients
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task integration
      - task e2e

  # Always reap testcontainers leftovers on the host Docker (Ryuk is disabled
  # here, so this is the safety net for crashes/timeouts). Runs on success OR
  # failure, and reports anything still standing (should be none).
  cleanup:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      - status: [success, failure]
    commands:
      - 'docker rm -f $(docker ps -aq --filter label=org.testcontainers=true) 2>/dev/null || true'
      - 'docker network prune -f 2>/dev/null || true'
      - 'docker image prune -f 2>/dev/null || true'
      - 'echo "leftover testcontainers containers (expect none):"; docker ps -a --filter label=org.testcontainers=true'

# Integration + e2e — needs a container engine on the runner.
#
# Requirements (finalize on your Woodpecker runner):
#   - podman available (poddle's engine + its ssh client),
#   - privileged so nested podman can run (repo must be security-trusted),
#   - a docker-compatible socket for testcontainers-go (started below).

when:
  - event: [manual]

steps:
  e2e:
    image: quay.io/podman/stable
    privileged: true
    environment:
      DOCKER_HOST: unix:///tmp/podman-run/podman.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
    commands:
      - dnf install -y golang git openssh-clients
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      # docker-compatible socket for testcontainers, in a writable path
      - mkdir -p /tmp/podman-run
      - podman system service --time=0 unix:///tmp/podman-run/podman.sock &
      - for i in $(seq 1 20); do [ -S /tmp/podman-run/podman.sock ] && break; sleep 1; done
      - task integration
      - task e2e

# Secret-safety e2e — block_paths refusal + broker egress redaction.
#
# Real `poddle up` on this step's nested podman:
#   - a template that mounts a blocked host path is refused before create;
#   - a pod that POSTs a secret (as JSON) through the broker has it scrubbed by
#     egress redaction before it reaches the mock upstream.
# Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-secure:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-secure

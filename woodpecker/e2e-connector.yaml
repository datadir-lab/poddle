# Connector e2e — private service access routed through the broker, one subtest
# per built-in connector.
#
# Real `poddle up` on this step's nested podman drives every connector's wiring:
#   git hosts (forgejo/gitea/github/gitlab/bitbucket) — git url.insteadOf; the
#     handle rides as the Basic username, broker swaps for the real user:token.
#   CI (woodpecker/drone/argocd) — server/token env; a Bearer call routes
#     through the broker, which swaps the handle for the real token.
#   jenkins — handle in JENKINS_URL userinfo (Basic, via curl).
#   npm — .npmrc Bearer;  pypi — pip index Basic (python image);
#   docker — ~/.docker/config.json Basic, replayed at the broker.
# Each mock upstream sees the real creds, never the handle. Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-connector:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-connector

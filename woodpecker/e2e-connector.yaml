# Connector e2e — private service access routed through the broker, three ways.
#
# Real `poddle up` on this step's nested podman drives each auth+wiring pattern:
#   forgejo    — git config rewrite; `git clone` sends the handle as its Basic
#                username, the broker swaps it for the real user:token.
#   npm        — .npmrc registry+token; `npm view` sends the handle as a Bearer,
#                the broker swaps it for the real token.
#   woodpecker — WOODPECKER_SERVER/TOKEN env; a Bearer call routes through the
#                broker, which swaps the handle for the real token.
# Each mock upstream sees the real creds, never the handle. Manual.
#
# Requires the repo to be security-trusted (privileged, for nested podman).

when:
  - event: [manual]

steps:
  e2e-connector:
    image: quay.io/podman/stable
    privileged: true
    commands:
      - dnf install -y golang git
      - export PATH=$PATH:$(go env GOPATH)/bin
      - go install github.com/go-task/task/v3/cmd/task@latest
      - task e2e-connector
